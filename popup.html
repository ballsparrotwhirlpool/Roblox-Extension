<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Server Navigator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div><h1>Better Roblox Features</h1><p>Features toggle</p></div>
      <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
        <span class="theme-label">Light</span><span class="theme-knob" aria-hidden="true">☀</span>
      </button>
    </header>

    <section class="primary-section" aria-labelledby="play-title">
      <div class="section-heading"><h2 id="play-title">Play buttons</h2><span>Quick access</span></div>
      <div class="play-grid">
        <label class="setting-row"><span><strong>Rejoin server</strong><small>Your last server</small></span><input class="switch" type="checkbox" data-feature="rejoinServer"></label>
        <label class="setting-row"><span><strong>Random server</strong><small>A new server</small></span><input class="switch" type="checkbox" data-feature="randomServer"></label>
      </div>
    </section>

    <section aria-labelledby="browser-title">
      <div class="section-heading"><h2 id="browser-title">Server browser</h2></div>
      <div class="settings-list">
        <div class="browser-toggle-grid">
          <label class="setting-row"><span><strong>Page navigation</strong><small>Browse servers by page</small></span><input class="switch" type="checkbox" data-feature="pagination"></label>
          <label class="setting-row"><span><strong>Server ID search</strong><small>Find a server by ID</small></span><input class="switch" type="checkbox" data-feature="serverIdSearch"></label>
        </div>
        <div class="range-setting" id="player-filter-control">
          <div class="range-copy"><span><strong>Player range</strong><small>Default filter for each game</small></span><button class="visibility-button" id="player-filter-toggle" type="button" aria-pressed="true">Shown</button></div>
          <div class="range-fields">
            <label><span>Minimum</span><input id="min-players" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label>
            <span class="range-separator">to</span>
            <label><span>Maximum</span><input id="max-players" type="number" min="0" step="1" inputmode="numeric" placeholder="Server cap"></label>
            <button id="reset-player-range" type="button" title="Reset player range">Reset</button>
          </div>
        </div>
        <label class="setting-row"><span><strong>Total controls</strong><small>Last page and refresh total</small></span><input class="switch" type="checkbox" data-feature="totalControls"></label>
      </div>
    </section>

    <section aria-labelledby="tools-title">
      <div class="section-heading"><h2 id="tools-title">Card tools</h2></div>
      <div class="tool-row">
        <label><span><strong>Favorites</strong><small>Save useful servers</small></span><input class="switch compact" type="checkbox" data-feature="favorites"></label>
        <label><span><strong>Avoid</strong><small>Hide unwanted servers</small></span><input class="switch compact" type="checkbox" data-feature="avoid"></label>
      </div>
      <button class="copy-action" type="button" data-action-feature="copyId" aria-pressed="true">
        <span><strong>Copy server ID</strong><small>Show this action on server cards</small></span><span class="action-state">Active</span>
      </button>
    </section>

    <footer>
      <div class="feature-count"><span class="status-dot"></span><span id="enabled-count">8 of 8 active</span></div>
      <div id="undo-toast" role="status" aria-live="polite" hidden><button id="undo" type="button">Undo</button></div>
      <button id="toggle-all" type="button">All features: Active</button>
    </footer>
    <div id="status" role="status" aria-live="polite"><span></span><span>Changes apply immediately</span></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
