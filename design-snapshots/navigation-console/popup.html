<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Server Navigator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="eyebrow"><span></span> Roblox utility</div>
      <div class="brand-row">
        <div><h1>Server<br>Navigator</h1><p>Find a better lobby, faster.</p></div>
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 14h8c10 0 10 20 20 20h4M34 28l6 6-6 6M8 34h7c4 0 7-3 10-8M26 20c3-4 6-6 10-6h4M34 8l6 6-6 6"/></svg></div>
      </div>
    </header>

    <section class="play-card" aria-labelledby="play-title">
      <div class="section-heading"><div><span class="section-number">01</span><h2 id="play-title">Play buttons</h2></div><span class="section-note">Quick launch</span></div>
      <div class="play-grid">
        <label class="feature-tile"><span class="tile-icon" aria-hidden="true">↻</span><span><strong>Rejoin</strong><small>Last server</small></span><input class="switch" type="checkbox" data-feature="rejoinServer" aria-label="Show Rejoin last server"></label>
        <label class="feature-tile"><span class="tile-icon" aria-hidden="true">⌁</span><span><strong>Random</strong><small>New lobby</small></span><input class="switch" type="checkbox" data-feature="randomServer" aria-label="Show Join random server"></label>
      </div>
    </section>

    <section aria-labelledby="browser-title">
      <div class="section-heading"><div><span class="section-number">02</span><h2 id="browser-title">Server browser</h2></div></div>
      <div class="inset-list">
        <label class="setting-row"><span><strong>Page navigation</strong><small>Jump between server pages</small></span><input class="switch" type="checkbox" data-feature="pagination"></label>
        <div class="range-setting" id="player-filter-control">
          <div class="range-copy"><span><strong>Player range</strong><small>Default range for each game</small></span><button class="visibility-button" id="player-filter-toggle" type="button" aria-pressed="true">Shown</button></div>
          <div class="range-fields">
            <label><span>Min</span><input id="min-players" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label>
            <div class="range-line" aria-hidden="true"><i></i></div>
            <label><span>Max</span><input id="max-players" type="number" min="0" step="1" inputmode="numeric" placeholder="Any"></label>
          </div>
        </div>
        <label class="setting-row"><span><strong>Total controls</strong><small>Last page and refresh total</small></span><input class="switch" type="checkbox" data-feature="totalControls"></label>
      </div>
    </section>

    <section aria-labelledby="utilities-title">
      <div class="section-heading"><div><span class="section-number">03</span><h2 id="utilities-title">Card tools</h2></div></div>
      <div class="utility-grid">
        <label><span>☆</span> Favorites<input class="switch compact" type="checkbox" data-feature="favorites"></label>
        <label><span>⊘</span> Avoid<input class="switch compact" type="checkbox" data-feature="avoid"></label>
      </div>
      <button class="copy-action" type="button" data-action-feature="copyId" aria-pressed="true"><span class="copy-glyph" aria-hidden="true">⧉</span><span><strong>Copy server ID</strong><small>Action available on every server card</small></span><span class="action-state">On</span></button>
    </section>

    <div class="bulk-zone"><div><strong>Master controls</strong><span id="enabled-count">8 of 8 active</span></div><button id="toggle-all" type="button">Power down</button></div>
    <div id="status" role="status" aria-live="polite"><span></span><span>Changes apply immediately</span></div>
  </main>
  <div id="undo-toast" role="status" aria-live="polite" hidden><span>All features turned off</span><button id="undo" type="button">Undo</button></div>
  <script src="popup.js"></script>
</body>
</html>
